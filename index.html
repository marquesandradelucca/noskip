<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NoSkip">
<title>NoSkip</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=20261124235022">
<style>
/* Logo em código (splash e login), flat: 6 pontos como os dias da semana — brancos acesos, rosa de bônus, um vazio. */
.lg-pts{--t:15px;display:grid;grid-template-columns:repeat(3,var(--t));gap:calc(var(--t)*.48);width:max-content}
.lg-pts i{position:relative;width:var(--t);height:var(--t);border-radius:50%;background:#2C2C2E}
.lg-pts i::before{content:"";position:absolute;inset:0;border-radius:50%;opacity:0;background:#fff}
.lg-pts i.r::before{background:#FF2E6A}
.lg-pts.aceso i:not(.v)::before{opacity:1}
/* animação: acendem um a um; a rosa dá um pulso de bônus; a vazia fica apagada */
.lg-pts.anima i:not(.v)::before{animation:lg-acende .32s var(--d) ease-out forwards}
.lg-pts.anima i.r{animation:lg-pulso .5s var(--d) cubic-bezier(.3,1.6,.5,1) both}
/* halo da rosa: ao acender, uma luz rosa desfocada cresce atrás dela e se dissipa (glow de verdade, com blur) */
.lg-pts.anima i.r{isolation:isolate}
.lg-pts.anima i.r::after{content:"";position:absolute;inset:0;border-radius:50%;background:#FF2E6A;filter:blur(4px);z-index:-1;opacity:0;animation:lg-halo 1.1s var(--d) ease-out both}
@keyframes lg-halo{0%{opacity:0;transform:scale(.9)}30%{opacity:.9;transform:scale(1.35)}100%{opacity:0;transform:scale(1.6)}}
@keyframes lg-acende{from{opacity:0}to{opacity:1}}
@keyframes lg-pulso{0%{transform:scale(1)}45%{transform:scale(1.32)}100%{transform:scale(1)}}

/* splash: logo ≈ 1,75× a altura das maiúsculas do nome; espaço ≈ altura do x. Estilo embutido para aparecer no primeiro quadro. */
#splash{position:fixed;inset:0;z-index:100;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .45s ease}
#splash.sai{opacity:0;pointer-events:none}
.sp-grupo{display:flex;flex-direction:column;align-items:center;gap:16px;animation:sp-entra .4s ease-out both}
.sp-grupo span{font:600 30px/1 Inter,-apple-system,sans-serif;letter-spacing:-.5px;color:#fff}
@keyframes sp-entra{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.sp-grupo,.lg-pts.anima i,.lg-pts.anima i::before,.lg-pts.anima i::after{animation:none}.lg-pts.anima i:not(.v)::before{opacity:1}}
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><div class="sp-grupo"><div class="lg-pts anima"><i style="--d:0.25s"></i><i style="--d:0.37s"></i><i style="--d:0.49s"></i><i style="--d:0.61s"></i><i class="r" style="--d:.8s"></i><i class="v"></i></div><span>NoSkip</span></div></div>
<div id="app"></div>
<div id="camada"></div>
<script type="module" src="js/app.js?v=20261124235022"></script>
<script>
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
setTimeout(() => { const s = document.getElementById("splash"); if (s) s.remove(); }, 6000); // segurança: nunca fica preso na splash
</script>
</body>
</html>
