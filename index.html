<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NoSkip">
<title>NoSkip</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=20261124193843">
<style>
/* splash: logo com altura ≈ 1,75× a altura das maiúsculas do nome (≈ 0,6× a largura dele), espaço ≈ altura do x.
   Estilo embutido para aparecer no primeiro quadro, antes do CSS e do JS do app.
   As bolinhas "acendem" uma a uma, como os dias da semana no check-in; a rosa dá um pulso de bônus; a escura fica apagada. */
#splash{position:fixed;inset:0;z-index:100;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .45s ease}
#splash.sai{opacity:0;pointer-events:none}
.sp-grupo{display:flex;flex-direction:column;align-items:center;gap:16px;animation:sp-entra .25s ease-out both}
.sp-grupo span{font:600 30px/1 Inter,-apple-system,sans-serif;letter-spacing:-.5px;color:#fff}
.sp-logo{--w:60px;--r:calc(var(--w)*.1246);position:relative;width:var(--w);height:calc(var(--w)*.6325)}
.sp-logo i{position:absolute;inset:0;background:url(icons/logo.png) 0 0/100% 100% no-repeat;clip-path:circle(var(--r) at calc(var(--w)*var(--x)) calc(var(--w)*var(--y)));transform-origin:calc(var(--w)*var(--x)) calc(var(--w)*var(--y));opacity:.18;animation:sp-acende .2s var(--d) ease-out forwards}
.sp-logo i.vz{opacity:1;animation:none}
.sp-logo i.rosa{animation:sp-pulso .36s var(--d) cubic-bezier(.3,1.6,.5,1) forwards}
.sp-logo b{position:absolute;left:calc(var(--w)*var(--x) - var(--r));top:calc(var(--w)*var(--y) - var(--r));width:calc(var(--r)*2);height:calc(var(--r)*2);border-radius:50%;opacity:0;box-shadow:0 0 10px 1px rgba(255,255,255,.85);animation:sp-brilho .45s var(--d) ease-out forwards}
.sp-logo b.rosa{box-shadow:0 0 14px 3px rgba(255,46,106,.9)}
@keyframes sp-entra{from{opacity:0}to{opacity:1}}
@keyframes sp-acende{to{opacity:1}}
@keyframes sp-pulso{0%{opacity:.18;transform:scale(1)}45%{opacity:1;transform:scale(1.3)}100%{opacity:1;transform:scale(1)}}
@keyframes sp-brilho{0%{opacity:0}35%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.sp-grupo,.sp-logo i,.sp-logo b{animation:none}.sp-logo i{opacity:1}}
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><div class="sp-grupo"><div class="sp-logo"><b class="" style="--x:0.1309;--y:0.1309;--d:0.15s"></b><b class="" style="--x:0.5;--y:0.1309;--d:0.22s"></b><b class="" style="--x:0.8691;--y:0.1309;--d:0.29s"></b><b class="" style="--x:0.1309;--y:0.5016;--d:0.36s"></b><b class="rosa" style="--x:0.5;--y:0.5016;--d:0.46s"></b><i class="" style="--x:0.1309;--y:0.1309;--d:0.15s"></i><i class="" style="--x:0.5;--y:0.1309;--d:0.22s"></i><i class="" style="--x:0.8691;--y:0.1309;--d:0.29s"></i><i class="" style="--x:0.1309;--y:0.5016;--d:0.36s"></i><i class="rosa" style="--x:0.5;--y:0.5016;--d:0.46s"></i><i class="vz" style="--x:0.8691;--y:0.5016;--d:0s"></i></div><span>NoSkip</span></div></div>
<div id="app"></div>
<div id="camada"></div>
<script type="module" src="js/app.js?v=20261124193843"></script>
<script>
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
setTimeout(() => { const s = document.getElementById("splash"); if (s) s.remove(); }, 6000); // segurança: nunca fica preso na splash
</script>
</body>
</html>
