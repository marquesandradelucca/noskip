<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NoSkip">
<title>NoSkip</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=20261124192955">
<style>
/* splash: logo com altura ≈ 1,75× a altura das maiúsculas do nome (≈ 0,6× a largura dele), espaço ≈ altura do x.
   Estilo embutido para aparecer no primeiro quadro, antes do CSS e do JS do app */
#splash{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .45s ease}
#splash img{width:60px;height:auto;animation:splash-logo .7s cubic-bezier(.2,.8,.2,1) both}
#splash span{font:600 30px/1 Inter,-apple-system,sans-serif;letter-spacing:-.5px;color:#fff;animation:splash-nome .7s .12s cubic-bezier(.2,.8,.2,1) both}
#splash.sai{opacity:0;pointer-events:none}
@keyframes splash-logo{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
@keyframes splash-nome{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#splash img,#splash span{animation:none}}
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><img src="icons/logo.png" alt=""><span>NoSkip</span></div>
<div id="app"></div>
<div id="camada"></div>
<script type="module" src="js/app.js?v=20261124192955"></script>
<script>
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
setTimeout(() => { const s = document.getElementById("splash"); if (s) s.remove(); }, 6000); // segurança: nunca fica preso na splash
</script>
</body>
</html>
